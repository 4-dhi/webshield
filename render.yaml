services:
  - type: web
    name: webshield-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
